<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Flow Rate Monitoring App</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"> </script>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #fff;
      --accent: #1565c0;
      --ok: #2e7d32;
      --warn: #fbc02d;
      --danger: #c62828;
      --muted: #6b7280;
      font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
    }

    body {
      background: var(--bg);
      margin: 0;
      padding: 18px;
      color: #111;
    }

    .container {
      max-width: 1250px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 16px;
    }

    .card {
      background: var(--card);
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(16, 24, 40, 0.06);
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }

    input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #e6e9ef;
      margin-top: 6px;
      box-sizing: border-box;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row>* {
      flex: 1;
    }

    button {
      border: 0;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      font-weight: 600;
      margin-top: 10px;
      width: 100%;
      font-size: 14px;
    }

    .openBtn {
      background: var(--ok);
    }

    .closeBtn {
      background: var(--danger);
    }

    .nextplate {
      background: #9e9e9e;
    }

    .reset {
      background: var(--warn);
</html>
